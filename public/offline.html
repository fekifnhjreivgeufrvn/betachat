<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4ebe8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1715" media="(prefers-color-scheme: dark)">
  <title>Offline – betachat</title>
  <style>
    :root {
      --bg: #e4ebe8; --ink: #18231f; --muted: #5a6a65;
      --accent: #f0b429; --accent-ink: #2a2000;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1715; --ink: #e7f0ed; --muted: #93a6a0; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.45;
      text-align: center;
    }
    main { max-width: 22rem; }
    svg { width: 5rem; height: 5rem; border-radius: 22%; }
    h1 { margin: 1rem 0 0.4rem; font-size: 1.6rem; letter-spacing: -0.02em; }
    p { margin: 0 0 1.25rem; color: var(--muted); }
    button {
      border: 0;
      border-radius: 14px;
      padding: 0.7rem 1.4rem;
      background: var(--accent);
      color: var(--accent-ink);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 1024 1024" role="img" aria-label="betachat">
      <rect width="1024" height="1024" fill="#14504a"/>
      <rect x="192" y="246" width="640" height="460" rx="150" fill="#f4fbf9"/>
      <polygon points="286,660 262,828 474,700" fill="#f4fbf9"/>
      <circle cx="352" cy="476" r="46" fill="#f0b429"/>
      <circle cx="512" cy="476" r="46" fill="#f0b429"/>
      <circle cx="672" cy="476" r="46" fill="#f0b429"/>
    </svg>
    <h1>You're offline</h1>
    <p>betachat needs an internet connection to load your messages. It will pick up again as soon as you're back online.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", () => location.reload());
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
