name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: # also lets you run it by hand from the Actions tab

# Two pushes in a row queue up instead of deploying on top of each other
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Installs the exact Wrangler version pinned in package-lock.json
      - run: npm ci

      # Runs `wrangler deploy`: uploads src/ and public/ and applies any new
      # Durable Object migrations from wrangler.jsonc
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
